<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" width="640" height="200" role="img" aria-label="Undo"><style>
.pg{fill:#FFF8E7}.cd{fill:#fff;stroke:#E8E1CF;stroke-width:1.5}.ln{fill:#E6E0D2}.hd{fill:#BDB29C}
